 <body>

  <!-- ✅ Zaheen Loader -->
  <style>
    #zaheen-loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #e0f7fa 0%, #fffde7 50%, #e8f5e9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #zaheen-loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .zl-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .zl-logo {
      width: 130px;
      animation: zl-pulse 1.8s ease-in-out infinite;
    }
    .zl-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #d0eaff;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: zl-spin 0.85s linear infinite;
    }
    .zl-text {
      font-family: sans-serif;
      font-size: 14px;
      color: #555;
      letter-spacing: 0.5px;
    }
    @keyframes zl-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes zl-pulse {
      0%, 100% { transform: scale(1);    opacity: 1;   }
      50%       { transform: scale(1.07); opacity: 0.8; }
    }
  </style>

  <div id="zaheen-loader">
    <div class="zl-content">
      <img class="zl-logo" src="https://cdn.zaheen.com.pk/zaheen-web-img/ZaheenLogo.png" alt="Zaheen" />
      <div class="zl-spinner"></div>
      <p class="zl-text">Loading Zaheen...</p>
    </div>
  </div>
  <!-- ✅ End Loader -->

  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>
